# Replace the existing document workflow with this file
# Required secrets: DOCS_PUBLISH_URL and DOCS_PUBLISH_TOKEN
name: Generate and Publish Documents

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-documents
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate catalog and publish documents
        env:
          DOCS_PUBLISH_URL: ${{ secrets.DOCS_PUBLISH_URL }}
          DOCS_PUBLISH_TOKEN: ${{ secrets.DOCS_PUBLISH_TOKEN }}
        run: |
          python - <<'PY'
          import http.client, json, os, subprocess, tempfile, zipfile
          from pathlib import Path
          from urllib.parse import urlsplit

          url = os.environ.get("DOCS_PUBLISH_URL", "").strip()
          token = os.environ.get("DOCS_PUBLISH_TOKEN", "")
          address = urlsplit(url)
          if address.scheme != "https" or not address.hostname or address.username or address.password:
              raise SystemExit("DOCS_PUBLISH_URL 必须是 HTTPS 发布接口地址")
          if len(token) < 32 or any(c.isspace() for c in token):
              raise SystemExit("DOCS_PUBLISH_TOKEN 至少 32 个字符，不能包含空白")

          def git(*args):
              return subprocess.check_output(["git", *args]).decode("utf-8")

          catalog, documents, assets = {}, {}, {}
          image_types = {".png", ".jpg", ".jpeg", ".gif", ".webp", ".avif", ".svg"}
          for name in git("ls-files", "-z").split("\0"):
              if not name or any(p.lower() in {".git", ".github", ".svn", ".hg", ".ssh", ".aws", ".codex", ".agents", "node_modules", "dist"} or p.lower() == ".env" or p.lower().startswith(".env.") for p in name.split("/")):
                  continue
              path = Path(name)
              suffix = path.suffix.lower()
              if suffix != ".md" and suffix not in image_types:
                  continue
              if any(p.is_symlink() for p in [path, *path.parents]):
                  raise SystemExit(f"不支持符号链接：{name}")
              if suffix in image_types:
                  assets[name] = path
                  continue
              documents[name] = path
              history = []
              for line in git("log", "--format=%h%x00%aN%x00%aI%x00%s", "--", name).splitlines():
                  parts = line.split("\0", 3)
                  if len(parts) == 4:
                      history.append(dict(zip(("hash", "author", "date", "message"), parts)))
              if not history:
                  raise SystemExit(f"文档没有可用的 Git 历史：{name}")
              catalog[name] = {
                  "author": history[0]["author"],
                  "last_edited": history[0]["date"],
                  "history": history,
              }

          if not documents:
              raise SystemExit("没有找到 Markdown 文档")
          Path("passage_status.json").write_text(
              json.dumps(catalog, ensure_ascii=False, indent=2), encoding="utf-8")
          revision = git("rev-parse", "HEAD").strip()
          # Build on disk and stream the ZIP over HTTPS; no fixed workflow size cap.
          with tempfile.TemporaryFile() as archive:
              with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, allowZip64=True) as output:
                  output.writestr(".docs-manifest.json", json.dumps({"revision": revision}))
                  output.write("passage_status.json", "passage_status.json")
                  for name, path in {**documents, **assets}.items():
                      output.write(path, name)
              length = archive.tell()
              archive.seek(0)
              connection = http.client.HTTPSConnection(address.hostname, address.port or 443, timeout=300)
              try:
                  target = address.path or "/"
                  if address.query:
                      target += "?" + address.query
                  connection.putrequest("POST", target)
                  connection.putheader("Authorization", "Bearer " + token)
                  connection.putheader("Content-Type", "application/zip")
                  connection.putheader("Content-Length", str(length))
                  connection.endheaders()
                  while chunk := archive.read(1024 * 1024):
                      connection.send(chunk)
                  response = connection.getresponse()
                  if response.status != 200:
                      raise SystemExit(f"发布失败，HTTP {response.status}，请检查后端和反向代理配置")
                  result = json.loads(response.read(65536))
              except (OSError, http.client.HTTPException):
                  raise SystemExit("上传中断或接口连接失败，请检查网络后重试")
              finally:
                  connection.close()
          if result.get("status") != 200:
              raise SystemExit("后端未返回发布成功状态")
          print(f"发布成功：{len(documents)} 篇文档，{len(assets)} 张图片，版本 {revision}")
          PY

      - name: Commit passage_status.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update passage_status.json with history [skip ci]"
          file_pattern: passage_status.json
